services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-pipeline_db}
    ports:
      - "${PG_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-pipeline_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .                        # root — go.mod lives here
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:-pipeline_db}
      PORT: 8080
      API_KEY: ${API_KEY:?API_KEY is required}
    ports:
      - "${BACKEND_PORT:-8081}:8080"
    volumes:
      - pipeline_output:/app/data/output
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: apps/web
      dockerfile: Dockerfile
      args:
        # VITE_API_URL is left empty: nginx proxies /api/ to the backend service
        VITE_API_KEY: ${VITE_API_KEY:-}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  pipeline_output:
